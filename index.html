
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEPIDERM ADMIN</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f3;
      color: #333;
    }
    header {
      background: #ffffff;
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #e5ded8;
    }
    h1 { color: #967665; }
    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0000000a;
      text-align: center;
    }
    .card h2 { color: #967665; }
  </style>
</head>
<body>
  <header>
    <h1>DEPIDERM ADMIN</h1>
    <p>Sistema de administración</p>
  </header>
  <main>
    <h2>Panel principal</h2>
    <div class="grid">
      <div class="card">
        <h2>Agenda</h2>
        <p>Control de citas</p>
      </div>
      <div class="card">
        <h2>Clientes</h2>
        <p>Registro de clientes</p>
      </div>
      <div class="card">
        <h2>Pagos</h2>
        <p>Control de ingresos</p>
      </div>
      <div class="card">
        <h2>Estadísticas</h2>
        <p>Resumen del negocio</p>
      </div>
    </div>
  </main>
</body>
</html>
